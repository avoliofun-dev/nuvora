<!doctype html><html lang="id"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#07111b"/><meta name="description" content="Cardora — kartu digital, identitas, dan koleksi eksklusif."/><title>Cardora — Digital Identity & Collectibles</title><style>html,body{margin:0;background:#07111b;color:#edf2f7;font-family:DM Sans,system-ui,sans-serif}#boot-err{display:none;max-width:560px;margin:12vh auto;padding:0 22px}#boot-err pre{white-space:pre-wrap;background:#0d1a27;border:1px solid #203143;border-radius:10px;padding:12px;font-size:12px;color:#ff9aa8}</style></head><body><div id="root"></div><div id="boot-err"><h2>Halaman gagal dimuat</h2><p style="color:#93a3b5">Muat ulang halaman. Bila masih kosong, kirim pesan di bawah ini ke pengembang. Pastikan web dibuka lewat <code>npm run dev</code> atau situs yang sudah di-deploy, bukan dengan membuka file index.html langsung.</p><pre id="boot-msg"></pre></div><noscript><p style="padding:24px">Aktifkan JavaScript untuk membuka Cardora.</p></noscript><script>(function(){var m=[];function show(){var r=document.getElementById("root");if(r&&r.childNodes.length===0){document.getElementById("boot-err").style.display="block";document.getElementById("boot-msg").textContent=m.join("\n")||"Tidak ada error tercatat; skrip aplikasi mungkin gagal diunduh."}}addEventListener("error",function(e){m.push(String(e.message||e.error||"error")+(e.filename?" @ "+e.filename:""))});addEventListener("unhandledrejection",function(e){m.push("Promise: "+String(e.reason&&e.reason.message||e.reason))});setTimeout(show,4000)})()</script><script type="module" src="/src/main.jsx"></script></body></html>
